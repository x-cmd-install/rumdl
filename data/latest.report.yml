1))\n- **lsp**: write the mailto scheme when converting a bare email to a link ([600e229](https://github.com/rvben/rumdl/commit/600e229784352ce04c949bbb8d59bf82ba15a5d0))\n- **config**: measure suggestion distance in characters, not bytes ([eabdf80](https://github.com/rvben/rumdl/commit/eabdf802fc69654e459224f4cf801b7f673ac257))\n- **MD034**: emit a link, not an autolink, when fixing bare URLs in MDX ([98a6255](https://github.com/rvben/rumdl/commit/98a6255f7368e74e9f43be4c4fff9ae760118f65))\n- **config**: suggestion panics on multibyte characters ([dd88a4a](https://github.com/rvben/rumdl/commit/dd88a4a7c83b1e1961dcf99fec9cb6ebbd35395f))\n\n\n## Downloads\n\n| File | Platform | Checksum |\n|------|----------|----------|\n| [rumdl-v0.2.71-x86_64-unknown-linux-gnu.tar.gz](https://github.com/rvben/rumdl/releases/download/v0.2.71/rumdl-v0.2.71-x86_64-unknown-linux-gnu.tar.gz) | Linux x86_64 | [checksum](https://github.com/rvben/rumdl/releases/download/v0.2.71/rumdl-v0.2.71-x86_64-unknown-linux-gnu.tar.gz.sha256) |\n| [rumdl-v0.2.71-x86_64-unknown-linux-musl.tar.gz](https://github.com/rvben/rumdl/releases/download/v0.2.71/rumdl-v0.2.71-x86_64-unknown-linux-musl.tar.gz) | Linux x86_64 (musl) | [checksum](https://github.com/rvben/rumdl/releases/download/v0.2.71/rumdl-v0.2.71-x86_64-unknown-linux-musl.tar.gz.sha256) |\n| [rumdl-v0.2.71-aarch64-unknown-linux-gnu.tar.gz](https://github.com/rvben/rumdl/releases/download/v0.2.71/rumdl-v0.2.71-aarch64-unknown-linux-gnu.tar.gz) | Linux ARM64 | [checksum](https://github.com/rvben/rumdl/releases/download/v0.2.71/rumdl-v0.2.71-aarch64-unknown-linux-gnu.tar.gz.sha256) |\n| [rumdl-v0.2.71-aarch64-unknown-linux-musl.tar.gz](https://github.com/rvben/rumdl/releases/download/v0.2.71/rumdl-v0.2.71-aarch64-unknown-linux-musl.tar.gz) | Linux ARM64 (musl) | [checksum](https://github.com/rvben/rumdl/releases/download/v0.2.71/rumdl-v0.2.71-aarch64-unknown-linux-musl.tar.gz.sha256) |\n| [rumdl-v0.2.71-x86_64-apple-darwin.tar.gz](https://github.com/rvben/rumdl/releases/download/v0.2.71/rumdl-v0.2.71-x86_64-apple-darwin.tar.gz) | macOS x86_64 | [checksum](https://github.com/rvben/rumdl/releases/download/v0.2.71/rumdl-v0.2.71-x86_64-apple-darwin.tar.gz.sha256) |\n| [rumdl-v0.2.71-aarch64-apple-darwin.tar.gz](https://github.com/rvben/rumdl/releases/download/v0.2.71/rumdl-v0.2.71-aarch64-apple-darwin.tar.gz) | macOS ARM64 (Apple Silicon) | [checksum](https://github.com/rvben/rumdl/releases/download/v0.2.71/rumdl-v0.2.71-aarch64-apple-darwin.tar.gz.sha256) |\n| [rumdl-v0.2.71-x86_64-pc-windows-msvc.zip](https://github.com/rvben/rumdl/releases/download/v0.2.71/rumdl-v0.2.71-x86_64-pc-windows-msvc.zip) | Windows x86_64 | [checksum](https://github.com/rvben/rumdl/releases/download/v0.2.71/rumdl-v0.2.71-x86_64-pc-windows-msvc.zip.sha256) |\n\n## Installation\n\n### Using uv (Recommended)\n```bash\nuv tool install rumdl\n```\n\n### Using pip\n```bash\npip install rumdl\n```\n\n### Using pipx\n```bash\npipx install rumdl\n```\n\n### Direct Download\nDownload the appropriate binary for your platform from the table above, extract it, and add it to your PATH.\n"}
